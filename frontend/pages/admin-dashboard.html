<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviFix - Basic Admin Dashboard</title>
    <link rel="stylesheet" href="../css/admin-dashboard.css">
</head>
<body>

    <!-- Simple Navbar -->
    <header class="navbar">
        <div class="logo">
            <h2>CiviFix <small>(Admin)</small></h2>
        </div>
        <nav class="nav-links">
            <a href="admin-dashboard.html" class="active">Complaints</a>
            <a href="#">Suspecious Complaints</a>
        </nav>
        <div class="user-profile">
            <span>Eleanor Vance (Ward 7)</span>
            <button class="btn-logout">Logout</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="dashboard-container">
        
        

        <!-- Basic Complaints Table -->
        <section class="table-container">
            <table class="complaint-table" border="0.5" cellpadding="5" cellspacing="5" >
                  <caption>
                    Complaints and User Details
  </caption>
                <thead>
                    <tr>
                        <th>TITLE</th>
                        <th>ADDRESS</th>
                        <th>CATEGORY</th>
                        <th>USER</th>
                        <th>DATE & TIME</th>
                        <th>STATUS</th>
                        <th>PRIORITY</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="complaintTable">
                </tbody>
            </table>
        </section>
    </main>


<script src="../js/adminDashboard.js"></script>
</body>
</html>
