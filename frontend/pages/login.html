<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/login.css">

    <title>Login - CiviFix</title>
</head>

<body>
    <!-- header-->
<header class="site-header">
    <div class="container header-container">
        <!-- logo and Name-->
        <div class="brand">
          <img src="../images/logo/CiviFix-logo.svg" alt="logo"
    class="brand-logo"
>            <span class="brand-name">CiviFix</span>
        </div>

        <!-- Navigation-->
        <nav class="main-nav">
            <a href="#" class="nav-text">About</a>
            <a href="#" class="nav-text">How it Works</a>
            <a href="#" class="nav-text">Emergency Contacts</a>
        </nav>

</header>
<div class="whole-page">
    <div class="login-container">

        <!-- Logo -->
        <div class="login-logo">
            <img src="../images/logo/CiviFix-logo.svg"
                 alt="CiviFix Logo"
                 class="CiviFix-logo">

            <span>CiviFix</span>
        </div>

        <!-- Login Card -->
        <div class="login-card">

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to your CiviFix account
            </p>

            <!-- Login Form -->
            <form>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >
                </div>

                <!-- Forgot Password -->
                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <!-- Register -->
            <p class="register-text">
                Don't have an account?
                <a href="#">Register</a>
            </p>

        </div>

    </div>
</div>
</body>

</html>
