<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviFix - Complaint Details</title>
    <link rel="stylesheet" href="../css/details.css">
</head>
<body>

    <!-- Modern Header with Back Button -->
    <header class="details-header">
        <button type="button" class="back-btn" id="btn-back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span>Back</span>
        </button>
        <h2>Complaint Details</h2>
    </header>

    <!-- Main Content Card Container -->
    <main class="details-container">
        <div class="details-card">
            
            <div class="detail-row">
                <span class="label">Complaint ID</span>
                <span class="value" id="id">-</span>
            </div>

            <div class="detail-row">
                <span class="label">Title</span>
                <span class="value highlight" id="title">-</span>
            </div>

            <div class="detail-row">
                <span class="label">Category</span>
                <span class="value badge" id="category">-</span>
            </div>

            <div class="detail-row description-row">
                <span class="label">Description</span>
                <p class="value desc-text" id="description">-</p>
            </div>

            <div class="detail-row">
                <span class="label">Address</span>
                <span class="value" id="address">-</span>
            </div>

            <div class="detail-row">
                <span class="label">Status</span>
                <span class="value status-badge" id="status">-</span>
            </div>

            <div class="detail-row">
                <span class="label">Created At</span>
                <span class="value" id="createdAt">-</span>
            </div>

            <div class="image-section">
                <p class="label">Photo Proof</p>
                <div class="image-wrapper">
                    <img id="complaintImage" src="" alt="Complaint Image">
                </div>
            </div>

        </div>
    </main>

    <script src="../js/details.js"></script>
</body>
</html>
