<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviFix - File a Complaint</title>

    
    <!-- leaflet header files-->
    <link rel="stylesheet" href="../css/report-issue.css">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <img src="../images/logo/CiviFix-logo.svg" alt="CiviFix Logo" onerror="this.style.display='none'" class="brand-logo"/>
            <h2>CiviFix</h2>
        </div>
        <nav class="nav-links">
            <a href="user-dashboard.html">Dashboard</a>
            <a href="#" class="active">Report Issue</a>
        </nav>
        <div class="user-profile">
            <span class="user-name">Eleanor Vance</span>
            <button class="btn-logout" type="button">Logout</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="dashboard-container">

        <!-- Navigation Back Link -->
        <div id="backDashBoard"><a href="user-dashboard.html" class="back-link">Back to Dashboard</a></div>

        <!-- Header Title -->
        <div class="form-header">
            <h1>File a Municipal Complaint</h1>
            <p>Submit service requests directly to municipal repair crews.</p>
        </div>

        <!-- Form Layout (2 Columns) -->
        <form class="complaint-form" id="complaint-form">

            <div class="form-grid">

                <!-- Left Column: Incident Details -->
                <div class="form-section">
                    <h2>1. Incident Details</h2>

                    <div class="form-group">
                        <label>Complaint Title *</label>
                        <input type="text" placeholder="e.g., Deep road pothole on Elm St" id="title" required>
                    </div>

                    <div class="form-group">
                        <label>Municipal Category *</label>
                        <input type="radio" name="category" value="pothole / road" required> Potholes / Road Damage<br>
                        <input type="radio" name="category" value="garbage"> Garbage Collection<br>
                        <input type="radio" name="category" value="streetlight"> Streetlight Issues<br>
                        <input type="radio" name="category" value="drainage"> Drainage Problems<br>
                    </div>

                    <div class="form-group">
                        <label>Detailed Description *</label>
                        <textarea rows="4" id="detailedDescription" required placeholder="Describe the issue in detail..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Photo Evidence *</label>
                        <input type="file" name="photo" accept="image/*" id="image" required>
                    </div>
                </div>

                <!-- Right Column: Location -->
                <div class="form-section">
                    <h2>2. Location Details</h2>

                    <div class="form-group">
                        <label>Street Address / Landmark *</label>
                        <input type="text" placeholder="Enter street address or landmark" id="address" required>
                    </div>

                    <div id="map"></div>
                </div>

            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <a href="user-dashboard.html" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Submit Complaint</button>
            </div>

        </form>

    </main>

    <script src="../js/reportIssue.js"></script>
</body>
</html>
