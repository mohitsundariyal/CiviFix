<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css"/>
    <title>Landing page</title>
</head>
<body>

<!-- header-->
<header class="site-header">
    <div class="container header-container">
        <!-- logo and Name-->
        <div class="brand">
<img 
    src="images\CiviFix-logo.svg" 
    alt="CiviFix logo" 
    class="brand-logo"
>            <span class="brand-name">CiviFix</span>
        </div>

        <!-- Navigation-->
        <nav class="main-nav">
            <a href="#" class="nav-text">About</a>
            <a href="#" class="nav-text">How it Works</a>
            <a href="#" class="nav-text">Emergency Contacts</a>
        </nav>

        <!--Header Actions-->
        <div class="header-actions">
            <a href="#" class="login-link">Login</a>
            <a href="#" class="register-btn">Register</a>
            <button class="profile-btn">    
                <img 
        src="images/icons/user-logo-32.png"

        class="user-icon"></button>

    <!--hero section-->
    <section class="hero">
        <div class="container hero-container">
        <!--title-->
        <h1 class="hero-heading">Report. Track. Resolve.</h1>

        <!--description-->
        <p class="hero-desc">A modern municipal portal connecting neighborhood residents
                    with city repair crews to <br> fix urban issues quickly,
                    transparently, and accountably-first.</p>
            
        <!--hero action-->
        <div class="hero-actions">
                <a href="#" class="hero-btn primary-btn">Register Citizen Account</a>
                <a href="#" class="hero-btn secondary-btn">Sign In</a>
            </div>
        </div>
    </section>

</main>

<footer></footer>
